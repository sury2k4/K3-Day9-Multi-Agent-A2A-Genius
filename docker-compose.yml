services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-olist_disputes}
      POSTGRES_USER: ${POSTGRES_USER:-olist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - olist_disputes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-olist} -d ${POSTGRES_DB:-olist_disputes}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/workspace/data:ro
      - ./input:/workspace/input:ro
      - ./output:/workspace/output
      - ./logging:/workspace/logging
      - ./trace.jsonl:/workspace/trace.jsonl
      - ./metadata.json:/workspace/metadata.json
    command: ["run", "--require-official-batch"]

volumes:
  olist_disputes_postgres_data:
