[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-disputes"
version = "0.1.0"
description = "Deterministic multi-agent Olist dispute resolution pipeline"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0,<1.0",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "langfuse>=2.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
olist-disputes = "olist_disputes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
